<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 5 Challenge Exam</title>
<meta name="description" content="Test your knowledge with the 20-question Chapter 5 Challenge Exam. Immediate feedback and scoring.">

<style>
:root{
    --primary:#2563eb;
    --secondary:#1d4ed8;
    --success:#059669;
    --warning:#d97706;
    --danger:#dc2626;
    --light:#f8fafc;
    --border:#e5e7eb;
    --bg-body:#f9fafb;
    --bg-card:#ffffff;
    --text-main:#111827;
    --text-muted:#4b5563;
    --footer-text:#6b7280;
    --shadow:rgba(0,0,0,.08);
    --font-scale:1;
}

/* Dark Mode */
[data-theme="dark"]{
    --primary:#58a6ff;
    --secondary:#79b8ff;
    --success:#3fb950;
    --warning:#d29922;
    --danger:#f85149;
    --light:#161b22;
    --border:#30363d;
    --bg-body:#0d1117;
    --bg-card:#161b22;
    --text-main:#f0f6fc;
    --text-muted:#8b949e;
    --footer-text:#8b949e;
    --shadow:rgba(0,0,0,.4);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Segoe UI, Arial, sans-serif;
    background:var(--bg-body);
    color:var(--text-main);
    transition:background .3s, color .3s;
}

/* ===== Accessibility: Skip Link ===== */
.skip-link{
    position:absolute;
    top:-60px;
    left:0;
    background:var(--primary);
    color:#fff;
    padding:10px 16px;
    z-index:1000;
    text-decoration:none;
    border-radius:0 0 8px 0;
    transition:top .2s;
}
.skip-link:focus{
    top:0;
}

.sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
}

/* ===== Accessibility Toolbar ===== */
.a11y-bar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:var(--bg-card);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    position:sticky;
    top:0;
    z-index:900;
}

.a11y-group{
    display:flex;
    align-items:center;
    gap:6px;
}

.a11y-label{
    font-size:.85rem;
    font-weight:600;
    color:var(--text-muted);
    margin-right:4px;
}

.a11y-btn{
    min-width:40px;
    min-height:40px;
    padding:8px 12px;
    font-size:1rem;
    font-weight:600;
    border:2px solid var(--border);
    border-radius:6px;
    background:var(--bg-body);
    color:var(--text-main);
    cursor:pointer;
    transition:background .2s, border-color .2s;
}

.a11y-btn:hover{
    border-color:var(--primary);
}

.a11y-btn:focus-visible{
    outline:3px solid var(--primary);
    outline-offset:2px;
}

.a11y-btn[aria-pressed="true"]{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
}

.a11y-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

#font-level-display{
    font-size:.85rem;
    color:var(--text-muted);
    min-width:44px;
    text-align:center;
}

/* ===== Navigation ===== */
.site-nav{
    max-width:1200px;
    margin:16px auto 0;
    padding:12px 20px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 2px 8px var(--shadow);
}

.site-nav ul{
    list-style:none;
    margin:0 auto;
    padding:0;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
}

.site-nav a{
    display:inline-block;
    padding:10px 14px;
    text-decoration:none;
    color:var(--primary);
    font-weight:600;
    border-radius:6px;
    font-size:calc(1rem * var(--font-scale));
}

.site-nav a:hover,
.site-nav a:focus-visible{
    background:var(--primary);
    color:#fff;
    outline:none;
}

.site-nav a[aria-current="page"]{
    background:var(--primary);
    color:#fff;
}

/* ===== Hero ===== */
.hero{
    max-width:1200px;
    margin:24px auto 0;
    padding:40px 25px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 2px 8px var(--shadow);
    text-align:center;
}

.hero h1{
    margin:0;
    font-size:calc(2.4rem * var(--font-scale));
    color:var(--primary);
}

.hero p{
    font-size:calc(1.1rem * var(--font-scale));
    color:var(--text-muted);
    margin-top:15px;
}

/* ===== Main Container ===== */
.container{
    max-width:1000px;
    margin:auto;
    padding:40px 20px;
}

/* ===== Exam Form Styles ===== */
.exam-form{
    background:var(--bg-card);
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 8px var(--shadow);
    border:1px solid var(--border);
}

.question-block{
    margin-bottom:25px;
    padding-bottom:20px;
    border-bottom:1px solid var(--border);
}

.question-block:last-of-type{
    border-bottom:none;
}

.question-label{
    display:block;
    font-weight:600;
    font-size:calc(1.05rem * var(--font-scale));
    margin-bottom:8px;
    color:var(--text-main);
}

.question-input{
    width:100%;
    padding:12px;
    font-size:calc(1rem * var(--font-scale));
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--bg-body);
    color:var(--text-main);
    transition:border-color .2s;
}

.question-input:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37, 99, 235, 0.2);
}

.submit-btn{
    display:block;
    width:100%;
    padding:15px;
    font-size:calc(1.1rem * var(--font-scale));
    font-weight:700;
    color:#fff;
    background:var(--primary);
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:20px;
    transition:background .2s;
}

.submit-btn:hover{
    background:var(--secondary);
}

.submit-btn:focus-visible{
    outline:3px solid var(--primary);
    outline-offset:3px;
}

/* ===== Results Section ===== */
#results-area{
    margin-top:30px;
    padding:30px;
    border-radius:12px;
    text-align:center;
    display:none;
    border:1px solid var(--border);
}

#results-area.ready{
    background:rgba(5, 150, 105, 0.1);
    border-color:var(--success);
}

#results-area.improving{
    background:rgba(217, 119, 6, 0.1);
    border-color:var(--warning);
}

#results-area.review{
    background:rgba(220, 38, 38, 0.1);
    border-color:var(--danger);
}

.score-display{
    font-size:calc(2rem * var(--font-scale));
    font-weight:700;
    margin:10px 0;
}

.result-message{
    font-size:calc(1.1rem * var(--font-scale));
    margin-bottom:20px;
}

/* ===== Footer ===== */
footer{
    text-align:center;
    padding:40px;
    color:var(--footer-text);
    border-top:1px solid var(--border);
    margin-top:40px;
}

footer a{
    color:var(--primary);
    text-decoration:none;
    margin:0 10px;
}

footer a:hover{
    text-decoration:underline;
}

@media (prefers-reduced-motion: reduce){
    *{
        transition:none !important;
        animation:none !important;
    }
}

@media print{
    .a11y-bar, .site-nav, .submit-btn, footer { display:none; }
    body{ background:#fff; color:#000; }
    .exam-form, .hero { box-shadow:none; border:1px solid #ccc; }
}
</style>
</head>

<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<!-- ===== Accessibility Toolbar ===== -->
<div class="a11y-bar" role="toolbar" aria-label="Display and accessibility settings">
    <div class="a11y-group" role="group" aria-label="Text size controls">
        <span class="a1y-label" id="font-label">Text Size</span>
        <button type="button" class="a11y-btn" id="font-decrease" aria-label="Decrease text size">A−</button>
        <span id="font-level-display" aria-live="polite">100%</span>
        <button type="button" class="a11y-btn" id="font-increase" aria-label="Increase text size">A+</button>
        <button type="button" class="a11y-btn" id="font-reset" aria-label="Reset text size to 100 percent">Reset</button>
    </div>
    <div class="a11y-group">
        <button type="button" class="a11y-btn" id="theme-toggle" aria-pressed="false" aria-label="Toggle dark mode">🌙 Dark Mode</button>
    </div>
</div>

<!-- Top Ribbon -->
<div id="site-nav" class="site-nav" aria-label="Primary"></div>
<script src="nav.js"></script>

<header class="hero">
    <h1>Chapter 5 Challenge Exam</h1>
    <p>20 Questions • Mixed Review • Exam Readiness Assessment</p>
</header>

<main class="container" id="main-content">

    <form class="exam-form" id="exam-form" aria-label="Chapter 5 Challenge Exam">
        
        <div class="question-block">
            <label class="question-label" for="q1">1. log₂(128) = ?</label>
            <input type="text" id="q1" class="question-input" placeholder="Enter your answer">
        </div>

        <div class="question-block">
            <label class="question-label" for="q2">2. ln(e⁵) = ?</label>
            <input type="text" id="q2" class="question-input" placeholder="Enter your answer">
        </div>

        <div class="question-block">
            <label class="question-label" for="q3">3. Domain of y = log(x − 4)?</label>
            <input type="text" id="q3" class="question-input" placeholder="e.g., x > 4">
        </div>

        <div class="question-block">
            <label class="question-label" for="q4">4. Range of y = ln(x)?</label>
            <input type="text" id="q4" class="question-input" placeholder="Enter your answer">
        </div>

        <div class="question-block">
            <label class="question-label" for="q5">5. Vertical asymptote of y = log(x)?</label>
            <input type="text" id="q5" class="question-input" placeholder="e.g., x = 0">
        </div>

        <div class="question-block">
            <label class="question-label" for="q6">6. Product Rule: log(MN) = ?</label>
            <input type="text" id="q6" class="question-input" placeholder="Formula">
        </div>

        <div class="question-block">
            <label class="question-label" for="q7">7. Quotient Rule: log(M/N) = ?</label>
            <input type="text" id="q7" class="question-input" placeholder="Formula">
        </div>

        <div class="question-block">
            <label class="question-label" for="q8">8. Power Rule: log(Mᵖ) = ?</label>
            <input type="text" id="q8" class="question-input" placeholder="Formula">
        </div>

        <div class="question-block">
            <label class="question-label" for="q9">9. Convert: log₂(32) = ?</label>
            <input type="text" id="q9" class="question-input" placeholder="Enter your answer">
        </div>

        <div class="question-block">
            <label class="question-label" for="q10">10. Solve: 2ˣ = 32</label>
            <input type="text" id="q10" class="question-input" placeholder="Enter your answer">
        </div>

        <div class="question-block">
            <label class="question-label" for="q11">11. Half-Life Formula</label>
            <input type="text" id="q11" class="question-input" placeholder="Formula for t_1/2">
        </div>

        <div class="question-block">
            <label class="question-label" for="q12">12. Doubling Time Formula</label>
            <input type="text" id="q12" class="question-input" placeholder="Formula for t_2">
        </div>

        <div class="question-block">
            <label class="question-label" for="q13">13. Convert: 100(1.05)ᵗ to ae^(kt). Find k.</label>
            <input type="text" id="q13" class="question-input" placeholder="Decimal value">
        </div>

        <div class="question-block">
            <label class="question-label" for="q14">14. Annual growth rate of 100(1.08)ᵗ</label>
            <input type="text" id="q14" class="question-input" placeholder="Percentage">
        </div>

        <div class="question-block">
            <label class="question-label" for="q15">15. Continuous growth model: A = ?</label>
            <input type="text" id="q15" class="question-input" placeholder="Formula">
        </div>

        <div class="question-block">
            <label class="question-label" for="q16">16. pH = −log[H+]. If [H+] = 10⁻⁴, find pH.</label>
            <input type="text" id="q16" class="question-input" placeholder="Enter your answer">
        </div>

        <div class="question-block">
            <label class="question-label" for="q17">17. Can logarithms solve 2ˣ + x = 10? (Yes or No)</label>
            <input type="text" id="q17" class="question-input" placeholder="Yes or No">
        </div>

        <div class="question-block">
            <label class="question-label" for="q18">18. Domain Rule for Logs</label>
            <input type="text" id="q18" class="question-input" placeholder="Rule">
        </div>

        <div class="question-block">
            <label class="question-label" for="q19">19. Range of Logarithmic Functions</label>
            <input type="text" id="q19" class="question-input" placeholder="Range">
        </div>

        <div class="question-block">
            <label class="question-label" for="q20">20. Change of Base: log_b(x) = ?</label>
            <input type="text" id="q20" class="question-input" placeholder="Formula">
        </div>

        <button type="button" class="submit-btn" onclick="gradeExam()">Grade Exam</button>
    </form>

    <div id="results-area" role="alert" aria-live="polite"></div>

</main>

<footer>
    <p>
        <a href="index.html">← Chapter 5 Mastery Center</a> |
        <a href="graph-explorer.html">Graph Explorer</a>
    </p>

</footer>

<script>
(function () {
    'use strict';
    // ---------- Copyright Year ----------
    var yearEl = document.getElementById('copyright-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
    
    // ---------- Text Size Controls ----------
    var LEVELS = [0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];
    var MIN_INDEX = 0;
    var MAX_INDEX = LEVELS.length - 1;
    var DEFAULT_INDEX = 2;
    var STORE_KEY_SIZE = 'ch5-font-scale-index';
    var STORE_KEY_THEME = 'ch5-theme';
    var btnIncrease = document.getElementById('font-increase');
    var btnDecrease = document.getElementById('font-decrease');
    var btnReset    = document.getElementById('font-reset');
    var display     = document.getElementById('font-level-display');
    var root        = document.documentElement;

    function clamp(n, lo, hi) {
        return Math.min(hi, Math.max(lo, n));
    }

    function getStoredIndex() {
        try {
            var raw = window.localStorage.getItem(STORE_KEY_SIZE);
            if (raw === null) return DEFAULT_INDEX;
            var n = parseInt(raw, 10);
            return isNaN(n) ? DEFAULT_INDEX : clamp(n, MIN_INDEX, MAX_INDEX);
        } catch (e) { return DEFAULT_INDEX; }
    }

    function applyScale(index, announce) {
        index = clamp(index, MIN_INDEX, MAX_INDEX);
        var scale = LEVELS[index];
        root.style.setProperty('--font-scale', String(scale));
        document.body.style.fontSize = (scale * 100) + '%';
        display.textContent = Math.round(scale * 100) + '%';
        btnDecrease.disabled = (index === MIN_INDEX);
        btnIncrease.disabled = (index === MAX_INDEX);
        try { window.localStorage.setItem(STORE_KEY_SIZE, String(index)); } catch (e) {}
        if (announce) display.textContent = Math.round(scale * 100) + '% text size';
    }

    var currentIndex = getStoredIndex();
    applyScale(currentIndex, false);

    btnIncrease.addEventListener('click', function () {
        currentIndex = clamp(currentIndex + 1, MIN_INDEX, MAX_INDEX);
        applyScale(currentIndex, true);
    });
    btnDecrease.addEventListener('click', function () {
        currentIndex = clamp(currentIndex - 1, MIN_INDEX, MAX_INDEX);
        applyScale(currentIndex, true);
    });
    btnReset.addEventListener('click', function () {
        currentIndex = DEFAULT_INDEX;
        applyScale(currentIndex, true);
    });

    // ---------- Dark Mode Toggle ----------
    var themeToggle = document.getElementById('theme-toggle');

    function getPreferredTheme() {
        try {
            var stored = window.localStorage.getItem(STORE_KEY_THEME);
            if (stored === 'dark' || stored === 'light') return stored;
        } catch (e) {}
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
        return 'light';
    }

    function applyTheme(theme, persist) {
        if (theme === 'dark') {
            root.setAttribute('data-theme', 'dark');
            themeToggle.setAttribute('aria-pressed', 'true');
            themeToggle.textContent = '☀️ Light Mode';
        } else {
            root.removeAttribute('data-theme');
            themeToggle.setAttribute('aria-pressed', 'false');
            themeToggle.textContent = '🌙 Dark Mode';
        }
        if (persist) {
            try { window.localStorage.setItem(STORE_KEY_THEME, theme); } catch (e) {}
        }
    }

    var currentTheme = getPreferredTheme();
    applyTheme(currentTheme, false);

    themeToggle.addEventListener('click', function () {
        currentTheme = (currentTheme === 'dark') ? 'light' : 'dark';
        applyTheme(currentTheme, true);
    });
})();

// ---------- Exam Grading Logic ----------
function gradeExam() {
    // Correct answers (normalized for grading)
    let answers = [
        "7",                           // 1. log2(128)
        "5",                           // 2. ln(e^5)
        "x>4",                         // 3. Domain of log(x-4)
        "allrealnumbers",              // 4. Range of ln(x)
        "x=0",                         // 5. Vertical asymptote of log(x)
        "log(m)+log(n)",               // 6. Product Rule
        "log(m)-log(n)",               // 7. Quotient Rule
        "plog(m)",                     // 8. Power Rule
        "5",                           // 9. log2(32)
        "5",                           // 10. 2^x=32
        "ln(2)/|k|",                   // 11. Half-Life
        "ln(2)/k",                     // 12. Doubling Time
        "0.04879",                     // 13. k for 1.05
        "8%",                          // 14. Annual rate of 1.08
        "ae^(kt)",                     // 15. Continuous growth
        "4",                           // 16. pH of 10^-4
        "no",                          // 17. Can logs solve 2^x+x=10?
        "inside>0",                    // 18. Domain rule
        "allrealnumbers",              // 19. Range of logs
        "log(x)/log(b)"                // 20. Change of Base
    ];

    let score = 0;
    let resultsDiv = document.getElementById("results-area");
    resultsDiv.style.display = "block";
    resultsDiv.className = ""; // Reset classes

    for(let i = 1; i <= 20; i++){
        let student = document.getElementById("q"+i).value.toLowerCase().replace(/\s+/g, "");
        let answer = answers[i-1].toLowerCase().replace(/\s+/g, "");
        
        // Special handling for percentage signs
        if(i === 14 && student === "8") { student = "8%"; }
        // Special handling for half-life absolute value notation variations
        if(i === 11 && (student === "ln(2)/k" || student === "ln(2)/-k")) { student = "ln(2)/|k|"; }

        if(student === answer){
            score++;
        }
    }

    let percent = Math.round((score / 20) * 100);
    let message = "";
    let title = "";

    if(percent >= 85){
        title = "🎉 Exam Ready";
        message = "Score: " + score + "/20 (" + percent + "%). You demonstrate strong understanding of Chapter 5 concepts.";
        resultsDiv.className = "ready";
    } else if(percent >= 65){
        title = "📈 Almost Ready";
        message = "Score: " + score + "/20 (" + percent + "%). Review weaker areas before the exam.";
        resultsDiv.className = "improving";
    } else {
        title = "📚 More Review Needed";
        message = "Score: " + score + "/20 (" + percent + "%). Return to Worked Examples and the Cheat Sheet.";
        resultsDiv.className = "review";
    }

    resultsDiv.innerHTML = `
        <h2>${title}</h2>
        <div class="score-display">${score}/20 (${percent}%)</div>
        <p class="result-message">${message}</p>
    `;

    // Scroll to results
    resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
</script>

</body>
</html>
